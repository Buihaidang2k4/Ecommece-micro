spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8889}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:change-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me}

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8091

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8762/eureka/}

api:
  prefix: /api/v1

myshop:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-phase0-secret-key-32chars!!}
      expiration-ms: ${JWT_EXPIRATION:3600000}
      refreshable-duration-ms: ${JWT_REFRESHABLE_DURATION:604800000}
  kafka:
    user-registered-topic: myshop.user.registered
  outbox:
    relay-enabled: true
    relay-delay-ms: 1000
