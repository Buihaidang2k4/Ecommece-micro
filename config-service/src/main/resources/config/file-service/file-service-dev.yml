minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:admin123}
  # bucket is chosen by the calling service (request param), not fixed here
  presign-expire: ${MINIO_PRESIGN_EXPIRE:300}

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

myshop:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-phase0-secret-key-32chars!!}
