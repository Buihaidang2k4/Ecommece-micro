spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
  cloud:
    gateway:
      # limit
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 50
            redis-rate-limiter.burstCapacity: 100
            key-resolver: "#{@ipKeyResolver}"
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      # route
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=${api.prefix}/auth/**,${api.prefix}/users/**,${api.prefix}/admin/**
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=${api.prefix}/files/**,${api.prefix}/images/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=${api.prefix}/notifications/**
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=${api.prefix}/payment/**
        - id: core-service
          uri: lb://core-service
          predicates:
            - Path=${api.prefix}/**

myshop:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-phase0-secret-key-32chars!!}
