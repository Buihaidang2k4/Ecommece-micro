spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3307}/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

myshop:
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-phase0-secret-key-32chars!!}
  kafka:
    payment-succeeded-topic: myshop.payment.succeeded
    payment-failed-topic: myshop.payment.failed
    payment-expired-topic: myshop.payment.expired
  outbox:
    relay-enabled: true
    relay-delay-ms: 1000
  frontend:
    order-confirmed-base-url: ${FRONTEND_ORDER_CONFIRMED_URL:http://localhost:3000/cart/checkout/order-confirmed/}

payment:
  vn-pay:
    url: ${PAY_URL:}
    tmn-code: ${TMN_CODE:}
    secret-key: ${SECRET_KEY:}
    return-url: ${RETURN_URL:}
    version: ${VERSION:2.1.0}
    command: ${COMMAND:pay}
    order-type: ${ORDER_TYPE:other}
